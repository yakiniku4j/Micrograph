[project]
name = "micrograph"
version = "0.1.0"
description = "Micrograph: Declarative Subgraph Architecture & Micro-agent Runtime for LangGraph"
requires-python = ">=3.11"

dependencies = [
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "python-frontmatter>=1.1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
